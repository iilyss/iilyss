<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260">
<style>
  .f{font-family:'Nunito','Segoe UI',Helvetica,Arial,sans-serif;font-weight:800}
  .r{font-family:'Nunito','Segoe UI',Helvetica,Arial,sans-serif;font-weight:600}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .cur{animation:blink 1s step-end infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .fl{animation:float 3s ease-in-out infinite}
</style>
<rect x="1.5" y="1.5" width="877" height="257" rx="22" fill="#fff" stroke="#E5E5E5" stroke-width="3"/>
<!-- frame-like grid accent (designer vibe) -->
<g opacity=".5" stroke="#F0F0F0" stroke-width="1">
  <path d="M600 20V240M640 20V240M680 20V240M720 20V240M760 20V240M800 20V240M840 20V240"/>
  <path d="M580 40H860M580 80H860M580 120H860M580 160H860M580 200H860"/>
</g>
<!-- floating UI cards -->
<g class="fl">
  <rect x="640" y="52" width="180" height="110" rx="14" fill="#fff" stroke="#E5E5E5" stroke-width="2.5"/>
  <rect x="656" y="68" width="60" height="10" rx="5" fill="#FF9600"/>
  <rect x="656" y="88" width="148" height="8" rx="4" fill="#E5E5E5"/>
  <rect x="656" y="104" width="110" height="8" rx="4" fill="#E5E5E5"/>
  <rect x="656" y="128" width="70" height="22" rx="11" fill="#1CB0F6"/>
  <rect x="734" y="128" width="70" height="22" rx="11" fill="none" stroke="#E5E5E5" stroke-width="2"/>
</g>
<g class="fl" style="animation-delay:-1.5s">
  <rect x="700" y="150" width="130" height="70" rx="12" fill="#58CC02"/>
  <path d="M722 197 l12 -14 l12 8 l16 -20 l18 10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="800" cy="181" r="5" fill="#fff"/>
</g>
<!-- cursor -->
<g class="fl" style="animation-delay:-.8s">
  <path d="M612 150 l0 30 l8 -8 l6 13 l6 -3 l-6 -12 l11 0 z" fill="#3C3C3C"/>
  <rect x="628" y="186" width="54" height="20" rx="6" fill="#CE82FF"/>
  <text x="655" y="200" class="f" font-size="11" fill="#fff" text-anchor="middle">Ilyasa</text>
</g>
<text x="44" y="70" class="r" font-size="18" fill="#AFAFAF">Hi there, I'm</text>
<text x="44" y="122" class="f" font-size="52" fill="#3C3C3C">Ilyasa<tspan fill="#FF9600">.</tspan></text>
<text x="44" y="160" class="f" font-size="22" fill="#1CB0F6">Product Designer · UI/UX<tspan class="cur" fill="#1CB0F6">|</tspan></text>
<text x="44" y="196" class="r" font-size="15" fill="#777">Designing payment &amp; merchant experiences</text>
<text x="44" y="218" class="r" font-size="15" fill="#777">that make money movement feel simple.</text>
</svg>
